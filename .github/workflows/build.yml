# Builds the loader and the installer on GitHub's Windows machines - nothing to install locally.
#   * every push / PR: build and upload the result as a workflow artifact
#   * push a tag like v0.2.0: also publish GoCodeInstaller.exe + gocode-payload.zip as a GitHub Release.
#     The installer built in that run downloads gocode-payload.zip from this repo's latest release and verifies its checksum.
name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5  # only used to build the installer exe
        with:
          go-version: '1.22'

      - name: Install 32-bit MinGW-w64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
          update: false

      - name: Portable unit tests
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin;$env:PATH"
          g++ -std=c++17 -Iloader tests/test_lang.cpp loader/gocode_lang.cpp loader/pattern.cpp -o tests/test_lang.exe
          g++ -std=c++17 -Iloader tests/test_core_logic.cpp loader/core_logic.cpp -o tests/test_core.exe
          ./tests/test_lang.exe .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./tests/test_core.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build loader and installer
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin;$env:PATH"
          $url = "https://github.com/${{ github.repository }}/releases/latest/download/gocode-payload.zip"
          cmd /c "build.bat $url"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: gocode
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GoCodeInstaller.exe
            dist/gocode-payload.zip
