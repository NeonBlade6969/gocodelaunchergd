; GoCode loader settings
[loader]
; How long to wait after Geometry Dash starts before applying hooks and mods (milliseconds).
startup_delay_ms=1500
; Set to 0 to ignore native .dll mods (this also disables the Go mods) and only run .gocode scripts.
native_mods=1

[speedhack]
; Only these modules get their clocks scaled. Leave as is unless you know why.
modules=GeometryDash.exe,libcocos2d.dll,libExtensions.dll
min_speed=0.05
max_speed=10

[fps]
; The frame rate Geometry Dash uses when the FPS bypass is off.
base_fps=60
max_fps=100000
; Set to 1 to also treat any FPS bypass as an advantage (puts the session into Safe Mode).
taint_on_fps=0

[safe_mode]
; Requests whose URL contains one of these are blocked once the session is in Safe Mode
; (used speed exploits etc.). Comma separated, case-insensitive.
block=uploadGJLevel,updateGJUserScore,getGJLevelScores,uploadGJComment
